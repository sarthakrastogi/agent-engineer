<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="agent-engineer: turn your coding agent into a senior AI agent engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#1b1147"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glowTeal)"/>
    <rect width="1280" height="360" fill="url(#glowPurple)"/>
  </g>

  <!-- left: text -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="64" y="158" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2">agent-engineer</text>

    <text x="66" y="203" font-size="26" fill="#e2e8f0">Turn your coding agent into a</text>
    <text x="66" y="236" font-size="26" fill="#e2e8f0">Senior AI Engineer</text>

    <g font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      <rect x="64"  y="298" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="114" y="318">Claude Code</text>
      <rect x="174" y="298" width="86"  height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="217" y="318">Codex CLI</text>
      <rect x="270" y="298" width="74"  height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="307" y="318">Cursor</text>
      <rect x="354" y="298" width="92"  height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="400" y="318">OpenCode</text>
      <rect x="456" y="298" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="508" y="318">Gemini CLI</text>
    </g>
  </g>

  <!-- right: terminal card -->
  <g>
    <rect x="720" y="52" width="500" height="256" rx="14" fill="#05070f" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="746" cy="76" r="6" fill="#ef4444"/>
    <circle cx="766" cy="76" r="6" fill="#f59e0b"/>
    <circle cx="786" cy="76" r="6" fill="#22c55e"/>
    <text x="970" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b" text-anchor="middle">support-agent / session</text>
    <line x1="720" y1="98" x2="1220" y2="98" stroke="#ffffff" stroke-opacity="0.08"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="744" y="130" fill="#e2e8f0"><tspan fill="#5eead4">You:</tspan>   add a tool so the agent can issue refunds</text>
      <text x="744" y="162" fill="#a78bfa">hook  load agent-guardrails + agent-tools</text>
      <text x="744" y="194" fill="#94a3b8">agent amount cap, in code ........... <tspan fill="#4ade80">done</tspan></text>
      <text x="744" y="216" fill="#94a3b8">agent ownership check ............... <tspan fill="#4ade80">done</tspan></text>
      <text x="744" y="238" fill="#94a3b8">agent idempotency key ............... <tspan fill="#4ade80">done</tspan></text>
      <text x="744" y="272" fill="#fbbf24">gate: creating and rumnning evals</text>
      <rect x="744" y="284" width="9" height="16" fill="#5eead4">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.99;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>